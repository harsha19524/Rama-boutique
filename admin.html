<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Admin – Rama Boutique Designers</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Josefin+Sans:wght@200;300;400&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --gold:#C9A84C;--gold-light:#E2BC62;--gold-dim:rgba(201,168,76,0.15);
  --black:#0D0D0D;--white:#FAFAFA;
  --bg:#080808;--card:#0f0f0f;--card2:#141414;
  --border:rgba(201,168,76,0.12);
  --fd:'Cormorant Garamond',serif;--fs:'Josefin Sans',sans-serif;
  --pending:#E2BC62;--confirmed:#4CAF50;--delayed:#FF9800;--cancelled:#f44336;
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--white);font-family:var(--fs);min-height:100vh}

/* ── Login Screen ── */
#loginScreen{position:fixed;inset:0;background:var(--black);display:flex;align-items:center;justify-content:center;z-index:999}
.login-box{background:var(--card);border:1px solid var(--border);padding:3rem 2.5rem;width:100%;max-width:380px;text-align:center}
.login-logo{font-family:var(--fd);font-size:1.8rem;font-weight:300;margin-bottom:.3rem}
.login-logo span{color:var(--gold)}
.login-sub{font-family:var(--fs);font-size:.55rem;font-weight:200;letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.25);margin-bottom:2.5rem}
.login-label{display:block;font-family:var(--fs);font-size:.55rem;font-weight:300;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.35);text-align:left;margin-bottom:.4rem}
.login-input{width:100%;background:transparent;border:none;border-bottom:1px solid rgba(255,255,255,.12);padding:.75rem 0;font-family:var(--fs);font-size:.82rem;font-weight:200;color:var(--white);outline:none;transition:border-color .2s;margin-bottom:1.4rem}
.login-input:focus{border-color:var(--gold)}
.login-btn{width:100%;background:var(--gold);color:var(--black);font-family:var(--fs);font-size:.62rem;font-weight:400;letter-spacing:.22em;text-transform:uppercase;border:none;padding:1rem;cursor:pointer;transition:background .2s;margin-top:.4rem}
.login-btn:hover{background:var(--gold-light)}
.login-btn:disabled{opacity:.5;cursor:not-allowed}
.login-err{font-family:var(--fs);font-size:.65rem;color:#f44336;margin-top:.8rem;min-height:1rem;letter-spacing:.05em}

/* ── Main Admin Layout ── */
#adminApp{display:none;min-height:100vh}
.admin-nav{background:rgba(13,13,13,.97);border-bottom:1px solid var(--border);padding:1rem 2rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;backdrop-filter:blur(12px)}
.admin-logo{font-family:var(--fd);font-size:1.2rem;font-weight:300}
.admin-logo span{color:var(--gold)}
.admin-logo-sub{font-family:var(--fs);font-size:.5rem;font-weight:200;letter-spacing:.25em;text-transform:uppercase;color:rgba(255,255,255,.25);margin-top:.15rem}
.admin-nav-right{display:flex;align-items:center;gap:1.2rem}
.admin-user{font-family:var(--fs);font-size:.6rem;font-weight:200;letter-spacing:.1em;color:rgba(255,255,255,.35)}
.logout-btn{background:transparent;border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.4);font-family:var(--fs);font-size:.58rem;font-weight:200;letter-spacing:.15em;text-transform:uppercase;padding:.5rem 1rem;cursor:pointer;transition:all .2s}
.logout-btn:hover{border-color:rgba(201,168,76,.4);color:var(--gold)}

/* ── Stats Bar ── */
.stats-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;background:var(--border);margin-bottom:2px}
.stat-card{background:var(--card);padding:1.5rem 1.8rem}
.stat-val{font-family:var(--fd);font-size:2.2rem;font-weight:300;color:var(--gold);display:block;line-height:1}
.stat-lbl{font-family:var(--fs);font-size:.52rem;font-weight:200;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.28);margin-top:.4rem;display:block}

/* ── Main Content ── */
.admin-main{padding:2rem}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;flex-wrap:wrap;gap:1rem}
.section-title{font-family:var(--fd);font-size:1.8rem;font-weight:300;color:var(--white)}
.section-title em{font-style:italic;color:var(--gold)}

/* ── Filter Tabs ── */
.filter-tabs{display:flex;gap:2px;flex-wrap:wrap}
.filter-tab{background:var(--card);border:1px solid transparent;color:rgba(255,255,255,.35);font-family:var(--fs);font-size:.58rem;font-weight:200;letter-spacing:.18em;text-transform:uppercase;padding:.55rem 1.2rem;cursor:pointer;transition:all .2s}
.filter-tab:hover{color:var(--gold);border-color:var(--border)}
.filter-tab.active{background:rgba(201,168,76,.1);border-color:rgba(201,168,76,.3);color:var(--gold)}

/* ── Search ── */
.search-input{background:var(--card);border:1px solid var(--border);color:var(--white);font-family:var(--fs);font-size:.72rem;font-weight:200;padding:.6rem 1.1rem;outline:none;transition:border-color .2s;min-width:220px}
.search-input:focus{border-color:var(--gold)}
.search-input::placeholder{color:rgba(255,255,255,.2)}

/* ── Booking Cards ── */
.bookings-grid{display:flex;flex-direction:column;gap:2px}
.booking-card{background:var(--card);border-left:3px solid transparent;padding:1.5rem 1.8rem;display:grid;grid-template-columns:1fr auto;gap:1rem;align-items:start;transition:background .2s}
.booking-card:hover{background:var(--card2)}
.booking-card.pending{border-left-color:var(--pending)}
.booking-card.confirmed{border-left-color:var(--confirmed)}
.booking-card.delayed{border-left-color:var(--delayed)}
.booking-card.cancelled{border-left-color:var(--cancelled)}
.booking-info{display:grid;grid-template-columns:repeat(3,1fr);gap:.8rem 2rem}
.booking-field{}
.booking-field-lbl{font-family:var(--fs);font-size:.5rem;font-weight:200;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.25);margin-bottom:.3rem}
.booking-field-val{font-family:var(--fs);font-size:.72rem;font-weight:300;color:rgba(255,255,255,.8)}
.booking-name{font-family:var(--fd);font-size:1.1rem;font-weight:300;color:var(--white);margin-bottom:.8rem}
.booking-notes{font-family:var(--fs);font-size:.68rem;font-weight:200;color:rgba(255,255,255,.38);margin-top:.6rem;font-style:italic;grid-column:1/-1}
.booking-actions{display:flex;flex-direction:column;gap:.5rem;align-items:flex-end}
.status-badge{display:inline-flex;align-items:center;gap:.4rem;font-family:var(--fs);font-size:.52rem;font-weight:300;letter-spacing:.15em;text-transform:uppercase;padding:.35rem .8rem;border-radius:0}
.status-badge.pending{background:rgba(226,188,98,.1);border:1px solid rgba(226,188,98,.25);color:var(--pending)}
.status-badge.confirmed{background:rgba(76,175,80,.1);border:1px solid rgba(76,175,80,.25);color:var(--confirmed)}
.status-badge.delayed{background:rgba(255,152,0,.1);border:1px solid rgba(255,152,0,.25);color:var(--delayed)}
.status-badge.cancelled{background:rgba(244,67,54,.1);border:1px solid rgba(244,67,54,.25);color:var(--cancelled)}
.action-btns{display:flex;gap:.4rem;flex-wrap:wrap;justify-content:flex-end}
.action-btn{font-family:var(--fs);font-size:.52rem;font-weight:300;letter-spacing:.12em;text-transform:uppercase;border:none;padding:.45rem .9rem;cursor:pointer;transition:all .2s}
.action-btn.approve{background:rgba(76,175,80,.15);border:1px solid rgba(76,175,80,.3);color:#4CAF50}
.action-btn.approve:hover{background:rgba(76,175,80,.28)}
.action-btn.delay{background:rgba(255,152,0,.12);border:1px solid rgba(255,152,0,.25);color:#FF9800}
.action-btn.delay:hover{background:rgba(255,152,0,.25)}
.action-btn.cancel{background:rgba(244,67,54,.1);border:1px solid rgba(244,67,54,.22);color:#f44336}
.action-btn.cancel:hover{background:rgba(244,67,54,.22)}
.action-btn.wa{background:rgba(37,211,102,.1);border:1px solid rgba(37,211,102,.22);color:#25D366}
.action-btn.wa:hover{background:rgba(37,211,102,.22)}
.booking-date-submitted{font-family:var(--fs);font-size:.5rem;font-weight:200;letter-spacing:.1em;color:rgba(255,255,255,.2);margin-top:.4rem}

/* ── Delay Modal ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:500;display:none;align-items:center;justify-content:center;backdrop-filter:blur(6px)}
.modal-overlay.show{display:flex}
.modal-box{background:var(--card);border:1px solid var(--border);padding:2rem;max-width:400px;width:90%}
.modal-title{font-family:var(--fd);font-size:1.4rem;font-weight:300;margin-bottom:1.2rem;color:var(--white)}
.modal-label{font-family:var(--fs);font-size:.55rem;font-weight:200;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.3);margin-bottom:.4rem;display:block}
.modal-input,.modal-select,.modal-textarea{width:100%;background:transparent;border:none;border-bottom:1px solid rgba(255,255,255,.12);padding:.7rem 0;font-family:var(--fs);font-size:.78rem;font-weight:200;color:var(--white);outline:none;transition:border-color .2s;margin-bottom:1.2rem}
.modal-input:focus,.modal-select:focus,.modal-textarea:focus{border-color:var(--gold)}
.modal-textarea{resize:none;height:70px}
.modal-select{cursor:pointer;appearance:none}
.modal-btns{display:flex;gap:.6rem;justify-content:flex-end;margin-top:.5rem}
.modal-btn{font-family:var(--fs);font-size:.6rem;font-weight:300;letter-spacing:.18em;text-transform:uppercase;border:none;padding:.7rem 1.5rem;cursor:pointer;transition:all .2s}
.modal-btn.confirm{background:var(--gold);color:var(--black)}
.modal-btn.confirm:hover{background:var(--gold-light)}
.modal-btn.cancel-btn{background:transparent;border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.4)}
.modal-btn.cancel-btn:hover{border-color:rgba(255,255,255,.3);color:var(--white)}

/* ── Empty / Loading ── */
.empty-state{text-align:center;padding:4rem 2rem;color:rgba(255,255,255,.2);font-family:var(--fs);font-size:.72rem;font-weight:200;letter-spacing:.12em}
.loading-state{text-align:center;padding:3rem;color:rgba(201,168,76,.4);font-family:var(--fs);font-size:.65rem;letter-spacing:.2em;text-transform:uppercase}

/* ── Reviews Tab ── */
.rev-admin-card{background:var(--card);padding:1.5rem 1.8rem;border-bottom:1px solid rgba(255,255,255,.04);display:grid;grid-template-columns:1fr auto;gap:1rem;align-items:start}
.rev-admin-card:hover{background:var(--card2)}
.rev-admin-stars{color:var(--gold);font-size:.8rem;margin-bottom:.4rem}
.rev-admin-name{font-family:var(--fd);font-size:1rem;font-weight:300;color:var(--white);margin-bottom:.3rem}
.rev-admin-comment{font-family:var(--fd);font-size:.9rem;font-weight:300;font-style:italic;color:rgba(255,255,255,.55);line-height:1.7;margin-bottom:.6rem}
.rev-admin-meta{font-family:var(--fs);font-size:.52rem;font-weight:200;letter-spacing:.1em;color:rgba(255,255,255,.2)}
.rev-admin-media{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.6rem}
.rev-admin-media img{width:60px;height:60px;object-fit:cover;border:1px solid var(--border)}
.rev-delete-btn{background:rgba(244,67,54,.1);border:1px solid rgba(244,67,54,.22);color:#f44336;font-family:var(--fs);font-size:.52rem;font-weight:200;letter-spacing:.12em;text-transform:uppercase;padding:.45rem .9rem;cursor:pointer;transition:all .2s;white-space:nowrap}
.rev-delete-btn:hover{background:rgba(244,67,54,.22)}

/* ── Tabs ── */
.main-tabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:2rem}
.main-tab{font-family:var(--fs);font-size:.62rem;font-weight:200;letter-spacing:.2em;text-transform:uppercase;padding:.9rem 2rem;cursor:pointer;color:rgba(255,255,255,.35);border:none;background:transparent;border-bottom:2px solid transparent;transition:all .2s;margin-bottom:-1px}
.main-tab:hover{color:var(--gold)}
.main-tab.active{color:var(--gold);border-bottom-color:var(--gold)}

@media(max-width:768px){
  .stats-bar{grid-template-columns:1fr 1fr}
  .booking-info{grid-template-columns:1fr 1fr}
  .admin-main{padding:1rem}
  .booking-card{grid-template-columns:1fr}
  .action-btns{justify-content:flex-start}
  .filter-tabs{gap:2px}
  .filter-tab{padding:.45rem .8rem;font-size:.52rem}
}
</style>
</head>
<body>

<!-- Login Screen -->
<div id="loginScreen">
  <div class="login-box">
    <div class="login-logo"><span>Rama</span> Boutique</div>
    <div class="login-sub">Admin Panel</div>
    <label class="login-label">Email</label>
    <input class="login-input" id="loginEmail" type="email" placeholder="admin@ramaboutique.com" autocomplete="email"/>
    <label class="login-label">Password</label>
    <input class="login-input" id="loginPass" type="password" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"/>
    <button class="login-btn" id="loginBtn" onclick="doLogin()">Sign In</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<!-- Admin App -->
<div id="adminApp">

  <!-- Nav -->
  <nav class="admin-nav">
    <div>
      <div class="admin-logo"><span>Rama</span> Boutique Designers</div>
      <div class="admin-logo-sub">Admin Dashboard</div>
    </div>
    <div class="admin-nav-right">
      <div class="admin-user" id="adminUserEmail"></div>
      <button class="logout-btn" onclick="doLogout()">Sign Out</button>
    </div>
  </nav>

  <!-- Stats -->
  <div class="stats-bar">
    <div class="stat-card"><span class="stat-val" id="statTotal">—</span><span class="stat-lbl">Total Bookings</span></div>
    <div class="stat-card"><span class="stat-val" id="statPending">—</span><span class="stat-lbl">Pending</span></div>
    <div class="stat-card"><span class="stat-val" id="statConfirmed">—</span><span class="stat-lbl">Confirmed</span></div>
    <div class="stat-card"><span class="stat-val" id="statReviews">—</span><span class="stat-lbl">Reviews</span></div>
  </div>

  <!-- Main -->
  <div class="admin-main">

    <!-- Main Tabs -->
    <div class="main-tabs">
      <button class="main-tab active" onclick="switchTab('bookings', this)">Bookings</button>
      <button class="main-tab" onclick="switchTab('reviews', this)">Customer Reviews</button>
    </div>

    <!-- Bookings Tab -->
    <div id="tabBookings">
      <div class="section-header">
        <div class="section-title">All <em>Bookings</em></div>
        <input class="search-input" id="searchInput" type="text" placeholder="Search by name or phone…" oninput="renderBookings()"/>
      </div>
      <div class="filter-tabs">
        <button class="filter-tab active" onclick="setFilter('all', this)">All</button>
        <button class="filter-tab" onclick="setFilter('pending', this)">Pending</button>
        <button class="filter-tab" onclick="setFilter('confirmed', this)">Confirmed</button>
        <button class="filter-tab" onclick="setFilter('delayed', this)">Delayed</button>
        <button class="filter-tab" onclick="setFilter('cancelled', this)">Cancelled</button>
      </div>
      <br/>
      <div class="bookings-grid" id="bookingsGrid">
        <div class="loading-state">Loading bookings…</div>
      </div>
    </div>

    <!-- Reviews Tab -->
    <div id="tabReviews" style="display:none">
      <div class="section-header">
        <div class="section-title">Customer <em>Reviews</em></div>
      </div>
      <div id="reviewsGrid">
        <div class="loading-state">Loading reviews…</div>
      </div>
    </div>

  </div>
</div>

<!-- Delay Modal -->
<div class="modal-overlay" id="delayModal">
  <div class="modal-box">
    <div class="modal-title">Delay Booking</div>
    <label class="modal-label">New Preferred Date</label>
    <input class="modal-input" type="date" id="delayDate"/>
    <label class="modal-label">Reason for Delay</label>
    <textarea class="modal-textarea" id="delayReason" placeholder="e.g. Heavy workload, fabric not arrived…"></textarea>
    <div class="modal-btns">
      <button class="modal-btn cancel-btn" onclick="closeDelayModal()">Cancel</button>
      <button class="modal-btn confirm" onclick="confirmDelay()">Confirm Delay</button>
    </div>
  </div>
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

<script>
// ── Firebase Init ──────────────────────────────────────
const firebaseConfig = {
  apiKey: "AIzaSyCRYdROYMXUMDdi5iSu1XV8zRxh66MrCRE",
  authDomain: "rama-boutique-5b1fa.firebaseapp.com",
  projectId: "rama-boutique-5b1fa",
  storageBucket: "rama-boutique-5b1fa.firebasestorage.app",
  messagingSenderId: "1027440563031",
  appId: "1:1027440563031:web:7396b765239c91a5f96412"
};
firebase.initializeApp(firebaseConfig);
const db   = firebase.firestore();
const auth = firebase.auth();

// ── Auth ───────────────────────────────────────────────
auth.onAuthStateChanged(user => {
  if (user) {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('adminApp').style.display = 'block';
    document.getElementById('adminUserEmail').textContent = user.email;
    loadBookings();
    loadReviews();
  } else {
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('adminApp').style.display = 'none';
  }
});

async function doLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const pass  = document.getElementById('loginPass').value;
  const btn   = document.getElementById('loginBtn');
  const err   = document.getElementById('loginErr');
  err.textContent = '';
  btn.disabled = true;
  btn.textContent = 'Signing in…';
  try {
    await auth.signInWithEmailAndPassword(email, pass);
  } catch(e) {
    err.textContent = 'Invalid email or password. Please try again.';
    btn.disabled = false;
    btn.textContent = 'Sign In';
  }
}

function doLogout() {
  if (confirm('Sign out of admin panel?')) auth.signOut();
}

// ── Data ───────────────────────────────────────────────
let allBookings = [];
let currentFilter = 'all';

function loadBookings() {
  db.collection('bookings')
    .orderBy('createdAt', 'desc')
    .onSnapshot(snap => {
      allBookings = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      updateStats();
      renderBookings();
    });
}

function loadReviews() {
  db.collection('customer_reviews')
    .orderBy('createdAt', 'desc')
    .onSnapshot(snap => {
      document.getElementById('statReviews').textContent = snap.size;
      const grid = document.getElementById('reviewsGrid');
      if (snap.empty) { grid.innerHTML = '<div class="empty-state">No reviews yet.</div>'; return; }
      grid.innerHTML = '';
      snap.forEach(doc => {
        const d = doc.data();
        const stars = '★'.repeat(d.rating) + '☆'.repeat(5 - d.rating);
        const date  = d.createdAt ? new Date(d.createdAt.toDate()).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}) : '';
        let mediaHtml = '';
        if (d.media && d.media.length) {
          mediaHtml = '<div class="rev-admin-media">' + d.media.map(m => m.type === 'image' ? `<img src="${m.url}" alt=""/>` : `<video src="${m.url}" width="60" height="60" style="object-fit:cover"></video>`).join('') + '</div>';
        }
        const card = document.createElement('div');
        card.className = 'rev-admin-card';
        card.innerHTML = `
          <div>
            <div class="rev-admin-stars">${stars}</div>
            <div class="rev-admin-name">${d.name}</div>
            <div class="rev-admin-comment">"${d.comment}"</div>
            <div class="rev-admin-meta">${date} · ${d.likes || 0} likes</div>
            ${mediaHtml}
          </div>
          <button class="rev-delete-btn" onclick="deleteReview('${doc.id}')">Delete</button>`;
        grid.appendChild(card);
      });
    });
}

function updateStats() {
  const total     = allBookings.length;
  const pending   = allBookings.filter(b => (b.status||'pending') === 'pending').length;
  const confirmed = allBookings.filter(b => b.status === 'confirmed').length;
  document.getElementById('statTotal').textContent     = total;
  document.getElementById('statPending').textContent   = pending;
  document.getElementById('statConfirmed').textContent = confirmed;
}

function setFilter(f, el) {
  currentFilter = f;
  document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  renderBookings();
}

function renderBookings() {
  const q      = (document.getElementById('searchInput').value || '').toLowerCase();
  const grid   = document.getElementById('bookingsGrid');
  let filtered = allBookings;

  if (currentFilter !== 'all') filtered = filtered.filter(b => (b.status || 'pending') === currentFilter);
  if (q) filtered = filtered.filter(b =>
    (b.name||'').toLowerCase().includes(q) ||
    (b.phone||'').toLowerCase().includes(q)
  );

  if (!filtered.length) {
    grid.innerHTML = '<div class="empty-state">No bookings found.</div>';
    return;
  }

  grid.innerHTML = '';
  filtered.forEach(b => {
    const status  = b.status || 'pending';
    const date    = b.createdAt ? new Date(b.createdAt.toDate()).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}) : '—';
    const delayInfo = b.delayedDate ? `<div class="booking-field"><div class="booking-field-lbl">New Date</div><div class="booking-field-val" style="color:var(--delayed)">${b.delayedDate}</div></div>` : '';
    const delayReason = b.delayReason ? `<div class="booking-notes">Delay reason: ${b.delayReason}</div>` : '';

    const card = document.createElement('div');
    card.className = `booking-card ${status}`;
    card.innerHTML = `
      <div>
        <div class="booking-name">${b.name || '—'}</div>
        <div class="booking-info">
          <div class="booking-field"><div class="booking-field-lbl">Phone</div><div class="booking-field-val">${b.phone || '—'}</div></div>
          <div class="booking-field"><div class="booking-field-lbl">Service</div><div class="booking-field-val">${b.service || '—'}</div></div>
          <div class="booking-field"><div class="booking-field-lbl">Preferred Date</div><div class="booking-field-val">${b.date || '—'}</div></div>
          ${delayInfo}
          ${b.notes ? `<div class="booking-notes">📝 ${b.notes}</div>` : ''}
          ${delayReason}
        </div>
        <div class="booking-date-submitted">Submitted: ${date}</div>
      </div>
      <div class="booking-actions">
        <span class="status-badge ${status}">${status.charAt(0).toUpperCase()+status.slice(1)}</span>
        <div class="action-btns">
          ${status !== 'confirmed' ? `<button class="action-btn approve" onclick="updateStatus('${b.id}','confirmed')">✓ Confirm</button>` : ''}
          ${status !== 'delayed'   ? `<button class="action-btn delay"   onclick="openDelayModal('${b.id}')">⏱ Delay</button>` : ''}
          ${status !== 'cancelled' ? `<button class="action-btn cancel"  onclick="updateStatus('${b.id}','cancelled')">✕ Cancel</button>` : ''}
          <button class="action-btn wa" onclick="waContact('${b.phone}','${b.name}','${b.service}','${b.date}','${status}')">💬 WhatsApp</button>
        </div>
      </div>`;
    grid.appendChild(card);
  });
}

// ── Actions ────────────────────────────────────────────
async function updateStatus(id, status) {
  const label = status === 'confirmed' ? 'confirm' : 'cancel';
  if (!confirm(`Are you sure you want to ${label} this booking?`)) return;
  await db.collection('bookings').doc(id).update({ status });
}

// Delay modal
let delayTargetId = null;
function openDelayModal(id) {
  delayTargetId = id;
  document.getElementById('delayDate').value = '';
  document.getElementById('delayReason').value = '';
  document.getElementById('delayModal').classList.add('show');
}
function closeDelayModal() {
  document.getElementById('delayModal').classList.remove('show');
  delayTargetId = null;
}
async function confirmDelay() {
  const newDate = document.getElementById('delayDate').value;
  const reason  = document.getElementById('delayReason').value.trim();
  if (!newDate) { alert('Please select a new date.'); return; }
  await db.collection('bookings').doc(delayTargetId).update({
    status: 'delayed',
    delayedDate: newDate,
    delayReason: reason || ''
  });
  closeDelayModal();
}

// WhatsApp contact
function waContact(phone, name, service, date, status) {
  const clean = phone.replace(/\D/g,'');
  const num   = clean.startsWith('91') ? clean : '91' + clean;
  const msg   = `🌸 *Rama Boutique Designers*\n\nDear ${name},\n\nYour booking for *${service}* on *${date}* has been *${status}*.\n\nFor any queries, please call us at +91 99638 52855.\n\n_Team Rama Boutique_`;
  window.open(`https://wa.me/${num}?text=${encodeURIComponent(msg)}`, '_blank');
}

// Delete review
async function deleteReview(id) {
  if (!confirm('Delete this review permanently?')) return;
  await db.collection('customer_reviews').doc(id).delete();
}

// Tab switch
function switchTab(tab, el) {
  document.querySelectorAll('.main-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('tabBookings').style.display = tab === 'bookings' ? 'block' : 'none';
  document.getElementById('tabReviews').style.display  = tab === 'reviews'  ? 'block' : 'none';
}
</script>
</body>
</html>
